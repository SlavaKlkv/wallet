name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint
        run: |
          flake8 backend/
          isort --check-only backend/ tests/
          black --check backend/ tests/

      # Тесты гоняются на PostgreSQL, а не на SQLite: проверки конкурентности
      # опираются на SELECT … FOR UPDATE, которого в SQLite нет.
      - name: Tests
        env:
          SECRET_KEY: test-secret-key
          DEBUG: 'False'
          USE_SQLITE: '0'
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: pytest -q
